name: Discord GitHub Feed

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send update to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          RESPONSE=$(curl -sS -o response.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"username":"Luka'\''s Utils","content":"🔨 **New update to Luka'\''s Utils!**"}' \
            "$WEBHOOK")

          echo "Discord HTTP status: $RESPONSE"
          echo "Discord response:"
          cat response.txt

          if [ "$RESPONSE" -lt 200 ] || [ "$RESPONSE" -ge 300 ]; then
            exit 1
          fi
