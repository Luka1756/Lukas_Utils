name: Website Status

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check website and maintenance status
        env:
          WEBHOOK: ${{ secrets.WEBSITE_STATUS_WEBHOOK }}
        run: |
          URL="https://lukas-utils.in/"

          STATUS=$(curl -L -o /dev/null -s -w "%{http_code}" "$URL")

          MAINTENANCE=$(curl -L -s \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/maintenance.txt" \
            | tr -d '\r\n')

          if [ "$STATUS" != "200" ]; then
            MESSAGE="🔴 **WEBSITE OFFLINE**

          🌐 **Site:** Luka's Utils
          📡 **HTTP Status:** \`$STATUS\`

          ⚠️ The website appears to be unreachable."

          elif [ "$MAINTENANCE" = "ON" ]; then
            MESSAGE="🟡 **WEBSITE IN MAINTENANCE**

          🌐 **Site:** Luka's Utils
          🛠️ **Status:** \`MAINTENANCE\`

          The website is currently undergoing maintenance.
          Updates will resume once maintenance is complete."

          else
            MESSAGE="🟢 **WEBSITE ONLINE**

          🌐 **Site:** Luka's Utils
          📡 **HTTP Status:** \`200 OK\`
          ⏱️ **Check:** Daily

          🔗 https://lukas-utils.in/"

          fi

          PAYLOAD=$(jq -n \
            --arg username "Luka's Utils Status" \
            --arg content "$MESSAGE" \
            '{username: $username, content: $content}')

          curl -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK"
